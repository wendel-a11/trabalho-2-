
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos | Academia Fitness</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Academia Fitness</h1>
        <p>Sistema de Gerenciamento de Academia</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="alunos.html">Cadastrar Aluno</a></li>
            <li><a href="lista-alunos.html">Lista de Alunos</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Cadastro de Alunos</h2>
            <p>Preencha os dados para cadastrar um aluno.</p>

            <form>
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" required>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" required>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco">

                <label for="plano">Plano:</label>
                <select id="plano" required>
                    <option value="">Selecione um plano</option>
                    <option value="Básico">Básico</option>
                    <option value="Intermediário">Intermediário</option>
                    <option value="Premium">Premium</option>
                </select>

                <button type="submit">Cadastrar Aluno</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Academia Fitness</p>
    </footer>

</body>
</html>
